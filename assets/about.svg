<svg width="900" height="190" viewBox="0 0 900 190" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="900" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="55%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#101B36"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0" y1="0" x2="900" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 28) scale(180)">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="900" height="190" rx="20" fill="url(#cardBg)"/>
  <circle cx="820" cy="28" r="180" fill="url(#topGlow)"/>

  <!-- Dark glass inner surface -->
  <rect x="14" y="14" width="872" height="162" rx="14" fill="#101B36" fill-opacity="0.72" stroke="#247BFF" stroke-opacity="0.28"/>

  <!-- Left crimson-to-blue vertical accent bar -->
  <rect x="34" y="40" width="4" height="110" rx="2" fill="#247BFF"/>
  <rect x="34" y="40" width="4" height="34" rx="2" fill="#FF354F"/>

  <!-- Typography -->
  <text x="56" y="60" fill="#247BFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="3.5">ABOUT THE BUILDER</text>
  <text x="56" y="102" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="26" font-weight="700">Curious mind. Relentless builder.</text>
  <text x="56" y="138" fill="#AFC5E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16">Cybersecurity student exploring AI, full-stack development and real-world startup ideas.</text>

  <!-- Outer glowing border -->
  <rect x="1" y="1" width="898" height="188" rx="19" stroke="url(#glassBorder)" stroke-width="1.5"/>
</svg>
