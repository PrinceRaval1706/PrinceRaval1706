<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B16"/>
      <stop offset="55%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#101B36"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#247BFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="circuit" x1="60" y1="40" x2="1120" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#247BFF"/>
      <stop offset="100%" stop-color="#FF354F"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1030 70) scale(240)">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crimsonGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 310) scale(230)">
      <stop offset="0%" stop-color="#FF354F" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="240" fill="url(#blueGlow)"/>
  <circle cx="180" cy="310" r="230" fill="url(#crimsonGlow)"/>

  <!-- Subtle geometric grid -->
  <g stroke="#247BFF" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 72H1200M0 170H1200M0 268H1200"/>
    <path d="M64 0V340M360 0V340M840 0V340M1136 0V340"/>
  </g>

  <!-- Glowing geometric accent path -->
  <path d="M64 252L248 68H1136" stroke="url(#circuit)" stroke-width="2" stroke-opacity="0.7" filter="url(#glow)"/>
  <circle cx="248" cy="68" r="4" fill="#247BFF" filter="url(#glow)"/>
  <circle cx="64" cy="252" r="4" fill="#FF354F" filter="url(#glow)"/>

  <!-- Glass pill badge -->
  <rect x="78" y="64" width="388" height="34" rx="17" fill="#101B36" fill-opacity="0.85" stroke="#247BFF" stroke-opacity="0.45"/>
  <text x="98" y="86" fill="#AFC5E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4">DEVELOPER • BUILDER • FOUNDER</text>

  <!-- Main Title -->
  <text x="76" y="182" fill="#FFFFFF" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="1.5">PRINCE RAVAL</text>
  <text x="80" y="230" fill="#AFC5E8" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" font-weight="400">Building useful things with code, AI &amp; cybersecurity.</text>

  <!-- Accent bars -->
  <rect x="80" y="264" width="210" height="4" rx="2" fill="#247BFF" filter="url(#glow)"/>
  <rect x="296" y="264" width="84" height="4" rx="2" fill="#FF354F"/>

  <!-- Animated live pulse indicator -->
  <circle cx="1084" cy="260" r="10" fill="#FF354F" fill-opacity="0.2">
    <animate attributeName="r" values="6;14;6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.35;0.05;0.35" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1084" cy="260" r="5" fill="#FF354F">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Outer glowing border -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="22.5" stroke="url(#borderGrad)" stroke-width="2"/>
</svg>
